name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: release-keystore.jks
      ANDROID_KEY_ALIAS: facebook-invite
      ANDROID_STORE_PASSWORD: github-build-only
      ANDROID_KEY_PASSWORD: github-build-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FacebookInviteAutoScroll-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -v             -keystore "$ANDROID_KEYSTORE_PATH"             -alias "$ANDROID_KEY_ALIAS"             -keyalg RSA             -keysize 2048             -validity 3650             -storepass "$ANDROID_STORE_PASSWORD"             -keypass "$ANDROID_KEY_PASSWORD"             -dname "CN=Facebook Invite Auto Scroll, OU=Build, O=Personal, L=Unknown, ST=Unknown, C=PH"

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: FacebookInviteAutoScroll-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
